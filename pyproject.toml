[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "mimus"
version = "0.1.0"
description = "Mimus, a curious robot arm for NVIDIA Isaac Sim: depth-tracker presence drives generative behaviour through RMPflow and a gated servo bridge to a UFACTORY xArm 850."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
requires-python = ">=3.10"
authors = [{ name = "ATONATON, LLC" }]
keywords = ["isaac-sim", "rmpflow", "xarm", "ufactory", "robot", "interactive", "behaviour"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering",
]
dependencies = [
    "numpy>=1.26",
    "pyyaml>=6.0",
    "python-osc>=1.8",
    "rt_xarm_bridge>=0.1.0",
]

[project.optional-dependencies]
dev = []

[tool.setuptools.packages.find]
include = ["mimus*"]
