# RMPflow tuning parameters for the UFACTORY 850 (uf850).
# Tuned from UR10e defaults using ABB IRB 4600 config as reference.

api_version: 1.0

joint_limit_buffers: [.10, .10, .10, .10, .10, .10]   # 5.7 deg soft; the bridge clamps hard at 2 deg, the controller faults at 0

rmp_params:
    cspace_target_rmp:
        metric_scalar: 100.
        position_gain: 200.
        damping_gain: 100.
        robust_position_term_thresh: .5
        inertia: 1.
    cspace_trajectory_rmp:
        p_gain: 100.
        d_gain: 10.
        ff_gain: .25
        weight: 50.
    cspace_affine_rmp:
        final_handover_time_std_dev: .25
        weight: 2000.
    joint_limit_rmp:
        metric_scalar: 1000.
        metric_length_scale: .01
        metric_exploder_eps: 1e-3
        metric_velocity_gate_length_scale: .01
        accel_damper_gain: 200.
        accel_potential_gain: 1.
        accel_potential_exploder_length_scale: .1
        accel_potential_exploder_eps: 1e-2
    joint_velocity_cap_rmp:
        - joint_name: joint1
          max_velocity: 3.014
          velocity_damping_region: 0.3
          damping_gain: 1000.
          metric_weight: 100.
        - joint_name: joint2
          max_velocity: 3.014
          velocity_damping_region: 0.3
          damping_gain: 1000.
          metric_weight: 100.
        - joint_name: joint3
          max_velocity: 3.014
          velocity_damping_region: 0.3
          damping_gain: 1000.
          metric_weight: 100.
        - joint_name: joint4
          max_velocity: 3.014
          velocity_damping_region: 0.3
          damping_gain: 1000.
          metric_weight: 100.
        - joint_name: joint5
          max_velocity: 3.014
          velocity_damping_region: 0.3
          damping_gain: 1000.
          metric_weight: 100.
        - joint_name: joint6
          max_velocity: 3.014
          velocity_damping_region: 0.3
          damping_gain: 1000.
          metric_weight: 100.
    target_rmp:
        accel_p_gain: 80.
        accel_d_gain: 120.
        accel_norm_eps: .075
        metric_alpha_length_scale: 100000.
        min_metric_alpha: .01
        max_metric_scalar: 10000.
        min_metric_scalar: 2500.
        proximity_metric_boost_scalar: 200.
        proximity_metric_boost_length_scale: .02
        accept_user_weights: false
    axis_target_rmp:
        accel_p_gain: 210.
        accel_d_gain: 60.
        metric_scalar: 10.
        proximity_metric_boost_scalar: 3000.
        proximity_metric_boost_length_scale: .08
        accept_user_weights: false
    collision_rmp:
        damping_gain: 50.
        damping_std_dev: .04
        damping_robustness_eps: 1e-2
        damping_velocity_gate_length_scale: .01
        repulsion_gain: 800.
        repulsion_std_dev: .01
        metric_modulation_radius: .5
        metric_scalar: 10000.
        metric_exploder_std_dev: .02
        metric_exploder_eps: .001
    damping_rmp:
        accel_d_gain: 30.
        metric_scalar: 50.
        inertia: 100.

canonical_resolve:
    max_acceleration_norm: 50.
    projection_tolerance: .01
    verbose: false

# Base-frame capsule over the base and the whole J1/J2 housing (metal top 0.424); 0.50 would crowd the SLEEP flange.
body_cylinders:
    - name: link_base
      pt1: [0, 0, 0.44]
      pt2: [0, 0, 0]
      radius: .14

# Wrist spheres kept off that capsule: the only self-collision RMPflow has (collision_spheres are for obstacles).
body_collision_controllers:
  - name: link4
    radius: .07
  - name: link5
    radius: .07
  - name: link6
    radius: .07
